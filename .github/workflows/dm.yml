name: tiktok-dm

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (open chats, send nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tiktok-dm
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check session seeded
        run: |
          if [ ! -s state.json ]; then
            echo "::error::state.json is missing or empty. Run login.py locally and commit it."
            exit 1
          fi

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Send
        env:
          HEADLESS: "1"
          MAX_SENDS: "20"
          PROXY_URL: ${{ secrets.PROXY_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: xvfb-run -a python dm.py

      - name: Commit state and log
        if: always()
        run: |
          git config user.name  "dm-bot"
          git config user.email "dm-bot@users.noreply.github.com"
          git add -A state.json sent.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: session + sent log [skip ci]"
          git push
